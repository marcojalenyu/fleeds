name: fleeds
description: "Feeds in Flutter"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  http: ^1.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  web:
    generate: true
    image_path: "assets/icon.png"
    favicon: true

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/pfp/
    - assets/banner/